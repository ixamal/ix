[project]
name = "ix-crate"
version = "0.1.0"
description = "Identify and rehome untagged files under ~/Music/stems_audio. Dry-run by default."
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47", "certifi>=2024.0.0"]

[project.optional-dependencies]
shazam = ["shazamio>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
